name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Production credentials stay with the repository owner. Collaborators can
    # review and merge code, but only this account can trigger a deploy.
    if: vars.VPS_ENABLED == 'true' && github.actor == 'cool-boy2024'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/cokeai' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync release to server
        run: |
          rsync -az --delete \
            --exclude=.git \
            --exclude=.claude \
            --include=.env.example \
            --exclude=.env* \
            --exclude=node_modules \
            --exclude=.next \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Build and restart
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f .env || { echo "Missing .env on server"; exit 1; }
          PROFILE=""
          if grep -Eq '^CLOUDFLARE_TUNNEL_TOKEN=.+' .env; then
            PROFILE="--profile tunnel"
          fi
          COMPOSE="docker compose -f docker-compose.yml -f ops/sub2api/compose.yaml"
          $COMPOSE config --quiet
          $COMPOSE $PROFILE up -d --build
          $COMPOSE ps
          REMOTE

      - name: Smoke check
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && docker compose -f docker-compose.yml -f ops/sub2api/compose.yaml exec -T app wget -qO- http://127.0.0.1:3000/api/health"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && docker compose -f docker-compose.yml -f ops/sub2api/compose.yaml exec -T edge wget -qO- http://127.0.0.1:8080/healthz"
