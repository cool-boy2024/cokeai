name: ARM64 image check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect ARM64 manifests
        run: |
          set -e
          for image in \
            docker.n8n.io/n8nio/n8n:2.44.6 \
            cloudflare/cloudflared:latest \
            postgres:16-alpine \
            redis:7-alpine \
            node:22-alpine
          do
            echo "== $image"
            docker buildx imagetools inspect "$image" | grep -E 'Platform:.*linux/(arm64|amd64)' | sort -u
            docker buildx imagetools inspect "$image" | grep -q 'Platform:.*linux/arm64'
          done
