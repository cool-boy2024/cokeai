name: cokeai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cokeai
      POSTGRES_USER: cokeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cokeai -d cokeai"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cokeai
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - cokeai
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cokeai-app:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cokeai:${POSTGRES_PASSWORD}@postgres:5432/cokeai
      REDIS_URL: redis://redis:6379
      TZ: Asia/Shanghai
      NODE_ENV: production
      # Host scripts use SUB2API_INTERNAL_URL=127.0.0.1:18080 (the loopback
      # mapping). Inside the app container, reach Sub2API by service name.
      SUB2API_INTERNAL_URL: ${SUB2API_CONTAINER_URL:-http://sub2api:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - cokeai
    logging: *default-logging

  # Daily logical backups of the CokeAI and n8n databases. Runs as the host
  # deploy user (default 1000) so ./backups stays readable/writable without
  # root. Set BACKUP_UID/BACKUP_GID when the deploy user has another id.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Asia/Shanghai
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        mkdir -p /backups
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          for db in cokeai n8n; do
            tmp="/backups/$${db}-$${stamp}.sql.gz.part"
            out="/backups/$${db}-$${stamp}.sql.gz"
            if pg_dump -U cokeai -d "$$db" --clean --if-exists | gzip > "$$tmp"; then
              mv "$$tmp" "$$out"
              echo "[backup] wrote $$out"
            else
              rm -f "$$tmp"
              echo "[backup] failed for $$db" >&2
            fi
          done
          find /backups -maxdepth 1 -type f -name '*.sql.gz' \
            -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cokeai
    logging: *default-logging

  # Single ingress for both the Next.js app and the Sub2API gateway.
  # Route /v1/* and /v1beta/* to Sub2API; everything else to the app.
  # Port 8080 is bound to loopback for local debugging only; Cloudflare Tunnel
  # connects to http://edge:8080 over the private Docker network.
  edge:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-sub2api:8080}
      APP_UPSTREAM: ${APP_UPSTREAM:-app:3000}
      TZ: Asia/Shanghai
    volumes:
      - ./ops/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      # Comments-only by default; set EDGE_LIMITS_FILE to the rate-limit snippet
      # only after the opt-in image and tunnel prerequisites are verified.
      - ${EDGE_LIMITS_FILE:-./ops/edge/limits.caddy}:/etc/caddy/limits.caddy:ro
    ports:
      - "127.0.0.1:${EDGE_HOST_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - cokeai
    logging: *default-logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: cokeai
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-n8n.cokeai.cc.cd}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://${N8N_HOST:-n8n.cokeai.cc.cd}/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cokeai
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    # QUIC stalls for several seconds between this host and the Cloudflare edge.
    # HTTP/2 over TCP has been stable, so pin the transport.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      TZ: Asia/Shanghai
    depends_on:
      edge:
        condition: service_healthy
    networks:
      - cokeai
    logging: *default-logging

# In the Cloudflare Zero Trust dashboard, the public hostname origin must be:
#   cokeai.cc.cd -> http://edge:8080   (previously http://app:3000)
# n8n.cokeai.cc.cd can keep pointing at http://n8n:5678.
# See docs/SUB2API_OPERATIONS.md for the exact cutover steps.

networks:
  # Shared by app, edge, n8n and (when the Sub2API overlay is merged) Sub2API.
  cokeai:
    name: ${COKEAI_NETWORK:-cokeai_net}

volumes:
  postgres_data:
  redis_data:
  n8n_data:
